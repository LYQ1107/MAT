schema_version: mat.identity_experiment.v2
experiment_id: B1_predicted_part_strict
dataset: sleap_gerbils
protocol_file: assets/manifests/splits/gerbils_longitudinal_v1.json
reference_role: reference_sessions
development_role: development_sessions
sealed_test_role: sealed_test_sessions
query_gt_usage: evaluator_only
input_mode:
  pose: predicted
  crop: predicted_pose_parts
pose_model_training_protocol: official_random_frame_split
identity:
  backend: wildlife_tools
  descriptor: megadescriptor_t_224
  checkpoint_scope: verified_local_only
  feature_scope: global_plus_pose_parts
  part_groups: [head, front_trunk, rear_trunk, tail_base, tail_distal]
  train_backbone: false
matching:
  mode: part_aware
  solver: deterministic_greedy
  top_k: 4
  global_weight_candidates: [0.0, 0.25, 0.5, 0.75, 1.0]
  accept_threshold: null
  threshold_calibration: development
  calibration_objective: macro_f1
evaluation:
  instance_matching: geometry_only_after_identity
  sealed_truth_for_model: false
memory:
  policy: frozen
  immutable_anchor: true
  update: disabled
diagnostic_only: true
